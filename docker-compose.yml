version: '3.8'

services:
  prilozhenie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svetofor-prilozhenie
    ports:
      - "3000:3000"
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3